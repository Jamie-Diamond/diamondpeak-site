# Workflow-based GitHub Pages deploy, replacing the GitHub-managed branch build.
#
# Why this exists: the managed pages-build-deployment fails intermittently with
# "Deployment failed, try again later" (transient Pages service errors), and every
# failure emails Jamie. The build here is identical (same Jekyll builder GitHub
# uses for branch deploys, honouring _config.yml excludes); the difference is the
# deploy step retries twice (after 90s, then 5m) before declaring failure, so only
# a genuine, persistent Pages outage fails the run and sends an email.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Hourly VM data pushes can overlap a slow deploy; queue rather than cancel so
# every push still lands (a cancelled run can never leave the site stale-forever).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url }}
    steps:
      # timeout is 10 MINUTES by default, and that default was the bug (found 6 Aug
      # 2026). A deployment here can sit in `deployment_queued` for 20+ minutes and
      # still be perfectly healthy - one observed run took 27 minutes end to end. When
      # deploy1 gave up at 10 minutes the retry below fired, and because a Pages
      # deployment ID is the COMMIT SHA, creating a second deployment for the same
      # commit cancels the first: the log reads "Created deployment for <sha>" then
      # "Deployment cancelled" five seconds later. So the retry that exists to survive
      # transient failures was instead killing deploys that were merely slow, and no
      # number of re-runs could ever land them. 30 minutes covers the slowest observed
      # build with headroom; the retries stay for genuine Pages outages, which is what
      # they were added for.
      - id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          timeout: 1800000
      - if: steps.deploy1.outcome == 'failure'
        run: sleep 90
      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          timeout: 900000
      - if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 300
      - id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
