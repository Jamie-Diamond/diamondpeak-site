# Jekyll excludes — what must NEVER reach the published site.
# The app itself now lives at TOP-LEVEL coach/ (published as diamondpeak.uk/coach/)
# and holds nothing private: app.html, app.js, sw.js, manifest, icons. It is
# deliberately outside ClaudeCoach/ so that the blanket "exclude every ClaudeCoach
# subdirectory" rule below keeps applying to the engine without an exception per
# app asset. Its DATA is still read from ClaudeCoach/public/ (see below).
#
# The public ClaudeCoach surface is:
#   index/coach/overview/athlete-*.html, training-visualiser.html, and
#   ClaudeCoach/public/*.json (the sanitised data feed).
# Every OTHER ClaudeCoach subdirectory is excluded (athlete state, engine code,
# docs with health data). If you add a new ClaudeCoach subdirectory, add it here
# — and remember .gitignore is the real guard: what never enters the repo can
# never be published.
#
# ClaudeCoach/public/ is the one deliberate exception to the "exclude every
# subdirectory" rule: the dashboards fetch it over HTTP, so it has to be served.
# Its contents come only from lib/public_sanitise.py, which allow-lists fields
# and refuses to write if a forbidden key is present. Do NOT add it below.
#
# The old top-level site-data.json / training-data*.json are gone from the public
# surface: those paths now hold the PRIVATE full-fat files and are gitignored, so
# they never enter the repo and Jekyll never sees them.
exclude:
  - ClaudeCoach/athletes/
  - ClaudeCoach/blueprints/
  - ClaudeCoach/config/
  - ClaudeCoach/docs/
  - ClaudeCoach/docs-private/
  - ClaudeCoach/ironman-analysis/
  - ClaudeCoach/lib/
  - ClaudeCoach/logs/
  - ClaudeCoach/onboarding/
  - ClaudeCoach/reference/
  - ClaudeCoach/scripts/
  - ClaudeCoach/system/
  - ClaudeCoach/telegram/
  - ClaudeCoach/templates/
  - ClaudeCoach/README.md
  - ClaudeCoach/training-plan-2026-04-27_to_2026-05-17.md
  - ClaudeCoach/session-log.json
  - ClaudeCoach/heat-log.json
  - ClaudeCoach/last_activity_state.json
  - ClaudeCoach/cc-gitpull.sh
  - CLAUDE.md
  - DESIGN.md
  - DESIGN_SETUP.md
