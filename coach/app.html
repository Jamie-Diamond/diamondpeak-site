<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Peak — Diamond Peak Coaching</title>
<meta name="description" content="Training almanac for Diamond Peak athletes.">

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#efe9dc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Peak">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">

<style>
/* ═══════════════════════════════════════════════════════════════════════════
   Peak — a training almanac.

   Direction: ink on warm paper. A printed logbook, not a dashboard. Hairline
   rules instead of boxes and shadows; Libre Baskerville for figures so numbers
   read as typeset rather than rendered; DM Mono only for labels and units, at
   9-10px with wide tracking, the way a printed table annotates itself. ONE
   accent (the green) earns its place by marking only what is done or key.
   Everything else is ink, secondary ink, or the rule colour.

   Palette is the one the existing pages already declare, pushed harder: the
   paper is warmed a shade for chrome so the content sheets sit ON something.
   ═══════════════════════════════════════════════════════════════════════════ */

:root{
  --paper:#f8f5ef;      /* content sheet */
  --paper-2:#efe9dc;    /* chrome / behind the sheet */
  --ink:#18160f;
  --ink-2:#4a4535;
  --muted:#9a9080;
  --rule:#ddd8cc;
  --rule-soft:#e8e2d6;
  --green:#1d6840;
  --blue:#1a5276;
  --amber:#b7791f;
  --red:#b91c1c;
  --tab-h:58px;
  --sheet:min(680px,100%);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  font-family:'DM Sans',system-ui,sans-serif;
  font-weight:300;
  font-size:15px;
  line-height:1.5;
  color:var(--ink);
  background:var(--paper-2);
  /* Faint paper tooth. Two tiny gradients rather than an image: no request, and
     it survives being cached offline. */
  background-image:
    radial-gradient(circle at 18% 12%, rgba(24,22,15,.020) 0 1px, transparent 1px),
    radial-gradient(circle at 72% 63%, rgba(24,22,15,.016) 0 1px, transparent 1px);
  background-size:7px 7px, 11px 11px;
  padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px));
  overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
}

/* ── masthead ───────────────────────────────────────────────────────────── */

.masthead{
  position:sticky; top:0; z-index:60;
  padding:calc(14px + env(safe-area-inset-top,0px)) 18px 11px;
  background:linear-gradient(var(--paper-2) 72%, rgba(239,233,220,0));
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
}
.masthead-row{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:var(--sheet);margin:0 auto}
.wordmark{font-family:'Libre Baskerville',serif;font-weight:700;font-size:19px;letter-spacing:-.02em;line-height:1;margin:0}
.wordmark{display:flex;align-items:center;gap:8px}
.wordmark em{font-style:italic;font-weight:400;color:var(--green)}
.wordmark{letter-spacing:-.01em}
.wordmark .mark{width:19px;height:19px;display:block}
.gate-logo{width:44px;height:44px;display:block;margin:0 0 18px}
.countdown{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);text-align:right;line-height:1.5;margin-left:auto}
.gear{
  flex:0 0 auto;appearance:none;border:1px solid var(--rule);border-radius:50%;
  background:var(--paper);width:34px;height:34px;display:grid;place-items:center;
  cursor:pointer;color:var(--ink-2);transition:color .16s ease,border-color .16s ease;
  -webkit-tap-highlight-color:transparent;
}
.gear:hover,.gear:focus-visible{color:var(--green);border-color:var(--green)}
.gear svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;display:block}
.gear[aria-pressed=true]{color:var(--green)}
.countdown b{display:block;font-family:'Libre Baskerville',serif;font-size:16px;letter-spacing:-.01em;color:var(--ink);text-transform:none}

/* ── whobar: one line, not three tabs ────────────────────────────────────── */
/* The athlete segmented control moved into the entry screen. Which athlete you
   are is settled once, on open, so it does not deserve permanent chrome on
   every view - it becomes a label with a way back. */
.whobar{
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  max-width:var(--sheet);margin:10px auto 0;
  padding-top:9px;border-top:1px solid var(--rule);
}
.whobar-name{
  appearance:none;background:none;border:0;padding:4px 0;cursor:pointer;
  display:flex;align-items:baseline;gap:8px;
  font-family:'Libre Baskerville',serif;font-size:15px;letter-spacing:-.01em;color:var(--ink);
  -webkit-tap-highlight-color:transparent;
}
.whobar-name .chg{
  font-family:'DM Mono',monospace;font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);border-bottom:1px solid var(--rule);
}
.whobar-name:hover .chg,.whobar-name:focus-visible .chg{color:var(--green);border-bottom-color:var(--green)}
.whobar-switch{
  appearance:none;background:none;border:0;padding:2px 0;cursor:pointer;
  font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);border-bottom:1px solid transparent;transition:color .18s,border-color .18s;
}
.whobar-switch:hover,.whobar-switch:focus-visible{color:var(--green);border-bottom-color:var(--green)}

/* ── entry screen ────────────────────────────────────────────────────────── */
.gate{
  position:fixed;inset:0;z-index:90;
  background:var(--paper);
  display:flex;align-items:center;justify-content:center;
  padding:32px 20px calc(32px + env(safe-area-inset-bottom));
  /* Faint letterpress grain so the screen reads as paper, not as a white modal. */
  background-image:radial-gradient(circle at 22% 18%,rgba(29,104,64,.05),transparent 58%),
                   radial-gradient(circle at 82% 88%,rgba(26,82,118,.05),transparent 60%);
  transition:opacity .34s ease,visibility .34s;
}
.gate.out{opacity:0;visibility:hidden;pointer-events:none}
body.gated{overflow:hidden}
.gate-inner{width:100%;max-width:var(--sheet)}
.gate-kicker{
  margin:0;font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--muted);
}
.gate-word{
  margin:12px 0 0;font-family:'Libre Baskerville',serif;font-weight:400;
  font-size:34px;line-height:1.02;letter-spacing:-.03em;color:var(--ink);
}
.gate-word em{font-style:italic;color:var(--green)}
.gate-sub{margin:9px 0 0;font-size:14.5px;color:var(--ink-2);max-width:30ch}
.gate-list{margin-top:26px;border-top:1px solid var(--rule)}

/* Hairline rows rather than boxed cards: the list should look like an index in a
   printed book, which is the whole conceit of the app. */
.gate-row{
  width:100%;display:flex;align-items:center;gap:15px;
  appearance:none;background:none;border:0;border-bottom:1px solid var(--rule);
  padding:17px 2px;cursor:pointer;text-align:left;
  opacity:0;animation:rise .5s cubic-bezier(.2,.7,.3,1) forwards;
}
.gate-row:nth-child(1){animation-delay:.06s}
.gate-row:nth-child(2){animation-delay:.13s}
.gate-row:nth-child(3){animation-delay:.2s}
.gate-mark{
  flex:0 0 auto;width:38px;height:38px;border-radius:50%;
  border:1px solid var(--rule);display:grid;place-items:center;
  font-family:'Libre Baskerville',serif;font-size:16px;color:var(--ink-2);
  transition:border-color .2s,color .2s,background .2s;
}
.gate-row-t{flex:1 1 auto;min-width:0}
.gate-row-t b{
  display:block;font-family:'Libre Baskerville',serif;font-weight:400;
  font-size:18px;letter-spacing:-.01em;color:var(--ink);
}
.gate-row-t span{
  display:block;margin-top:3px;font-family:'DM Mono',monospace;font-size:9.5px;
  letter-spacing:.13em;text-transform:uppercase;color:var(--muted);
}
.gate-go{flex:0 0 auto;color:var(--muted);font-size:17px;transition:transform .2s,color .2s}
.gate-row:hover .gate-mark,.gate-row:focus-visible .gate-mark{
  border-color:var(--green);color:var(--green);background:rgba(29,104,64,.05)
}
.gate-row:hover .gate-go,.gate-row:focus-visible .gate-go{transform:translateX(4px);color:var(--green)}
.gate-row.picked .gate-mark{background:var(--green);border-color:var(--green);color:var(--paper)}
.gate-foot{
  margin:20px 0 0;font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--muted);
}

/* ── sheet & sections ───────────────────────────────────────────────────── */

main{max-width:var(--sheet);margin:0 auto;padding:0 0 26px}
.view{display:none;padding:16px 18px 0}
.view.on{display:block}
.view.on > *{animation:rise .42s cubic-bezier(.16,1,.3,1) backwards}
.view.on > *:nth-child(1){animation-delay:.02s}
.view.on > *:nth-child(2){animation-delay:.07s}
.view.on > *:nth-child(3){animation-delay:.12s}
.view.on > *:nth-child(4){animation-delay:.17s}
.view.on > *:nth-child(5){animation-delay:.22s}
.view.on > *:nth-child(n+6){animation-delay:.26s}
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}


/* ── hero figures ───────────────────────────────────────────────────────── */

.figures{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--rule);border-radius:3px;background:var(--paper);overflow:hidden;margin:0 0 15px}
.fig{padding:13px 12px 12px;border-right:1px solid var(--rule-soft);text-align:center}
.fig:last-child{border-right:0}
.fig .n{font-family:'Libre Baskerville',serif;font-size:29px;line-height:1;letter-spacing:-.025em;display:block}
.fig .l{font-family:'DM Mono',monospace;font-size:8.5px;letter-spacing:.17em;text-transform:uppercase;color:var(--muted);margin-top:6px;display:block}
.fig .d{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);margin-top:3px;display:block}
.pos{color:var(--green)} .neg{color:var(--red)} .flat{color:var(--muted)}

/* ── session rows ───────────────────────────────────────────────────────── */

.day{border-bottom:1px solid var(--rule-soft)}
.day:last-child{border-bottom:0}
.day-h{display:flex;align-items:baseline;gap:9px;padding:9px 15px 5px;background:linear-gradient(var(--paper),var(--paper))}
.day-h .dow{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.17em;text-transform:uppercase;color:var(--muted)}
.day-h .dnum{font-family:'Libre Baskerville',serif;font-size:13px}
.day-h.today .dnum,.day-h.today .dow{color:var(--green)}
.day-h .sum{margin-left:auto;font-family:'DM Mono',monospace;font-size:9px;color:var(--muted)}

.sesh{display:flex;gap:11px;align-items:flex-start;padding:8px 15px 10px;position:relative}
.sesh + .sesh{border-top:1px dotted var(--rule-soft)}
.sesh .tick{flex:0 0 auto;width:15px;padding-top:3px;font-family:'DM Mono',monospace;font-size:11px;line-height:1;color:var(--muted)}
.sesh.done .tick{color:var(--green)}
.sesh .body{min-width:0;flex:1}
.sesh .nm{font-size:14px;font-weight:400;letter-spacing:-.005em}
.sesh.done .nm{color:var(--ink-2)}
.sesh .meta{font-family:'DM Mono',monospace;font-size:9.5px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sesh .rt{flex:0 0 auto;text-align:right;font-family:'DM Mono',monospace;font-size:9.5px;color:var(--muted);padding-top:2px}
.sesh .rt b{display:block;font-family:'Libre Baskerville',serif;font-size:14px;color:var(--ink);letter-spacing:-.01em}
.sp{display:inline-block;width:5px;height:5px;border-radius:50%;margin-right:5px;vertical-align:.08em}
.sp-swim{background:var(--blue)} .sp-bike{background:var(--green)} .sp-run{background:var(--amber)}
.sp-other{background:var(--muted)}
.keymark{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:.14em;color:var(--green);border:1px solid var(--green);border-radius:2px;padding:1px 4px;margin-left:6px;vertical-align:1.5px}

/* ── library ────────────────────────────────────────────────────────────── */

.lib{border:1px solid var(--rule);border-radius:3px;background:var(--paper);overflow:hidden}
.lib details{border-bottom:1px solid var(--rule-soft)}
.lib details:last-child{border-bottom:0}
.lib summary{
  list-style:none;cursor:pointer;padding:11px 15px;display:flex;align-items:baseline;gap:9px;
  -webkit-tap-highlight-color:transparent;
}
.lib summary::-webkit-details-marker{display:none}
.lib summary .nm{font-size:14px}
.lib summary .zn{margin-left:auto;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.1em;color:var(--muted)}
.lib .inner{padding:0 15px 13px;font-size:13.5px;color:var(--ink-2)}
.lib .prog{display:flex;flex-wrap:wrap;gap:5px;margin:9px 0 0}
.lib .prog span{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.06em;border:1px solid var(--rule);border-radius:2px;padding:3px 6px;color:var(--ink-2)}
.lib .note{margin-top:8px;font-size:13px;line-height:1.5;color:var(--ink-2);border-left:2px solid var(--rule);padding-left:10px}

/* ── goals / predictor table ─────────────────────────────────────────────── */

table.tbl{width:100%;border-collapse:collapse;font-family:'DM Mono',monospace;font-size:11px}
table.tbl th{
  text-align:left;font-weight:400;font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);padding:9px 15px 7px;border-bottom:1px solid var(--rule);
}
table.tbl td{padding:9px 15px;border-bottom:1px solid var(--rule-soft)}
table.tbl tr:last-child td{border-bottom:0}
table.tbl td.t{font-family:'Libre Baskerville',serif;font-size:15px;letter-spacing:-.01em}
table.tbl td.lbl{font-family:'DM Sans',sans-serif;font-size:13.5px;font-weight:400}
table.tbl tr.hl td{background:rgba(29,104,64,.05)}

.goal{display:flex;align-items:baseline;gap:10px;padding:11px 0;border-bottom:1px solid var(--rule-soft)}
.goal:last-child{border-bottom:0}
.goal .tag{font-family:'DM Mono',monospace;font-size:8.5px;letter-spacing:.16em;color:var(--muted);width:16px}
.goal .v{font-family:'Libre Baskerville',serif;font-size:19px;letter-spacing:-.02em}
.goal .n{margin-left:auto;font-family:'DM Mono',monospace;font-size:9.5px;color:var(--muted)}

/* bar — a printed measure, filled to the value */
.bar{height:5px;background:var(--rule-soft);border-radius:3px;overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:var(--green);border-radius:3px}
.bar.warn i{background:var(--amber)}


/* ── card: ONE container, with a header ─────────────────────────────────── */
/* The first cut floated an .eyebrow above a borderless .sheet, so every block
   had identical weight and the screen read as busy and sparse at once. A card
   with a titled header gives a section a top edge to start at, and lets an
   action (reset zoom, month arrows) live where it belongs. */
.card{
  background:var(--paper);border:1px solid var(--rule);border-radius:4px;
  margin:0 0 14px;overflow:hidden;
}
.card-h{
  display:flex;align-items:center;gap:10px;
  padding:11px 15px 10px;border-bottom:1px solid var(--rule-soft);
}
.card-h h2{
  margin:0;font-family:'DM Mono',monospace;font-weight:400;font-size:9.5px;
  letter-spacing:.17em;text-transform:uppercase;color:var(--ink-2);
}
.card-a{
  margin-left:auto;appearance:none;background:none;border:1px solid var(--rule);
  border-radius:2px;padding:4px 8px;cursor:pointer;color:var(--muted);
  font-family:'DM Mono',monospace;font-size:8.5px;letter-spacing:.13em;text-transform:uppercase;
  transition:color .16s,border-color .16s;
}
.card-a:hover,.card-a:focus-visible{color:var(--green);border-color:var(--green)}
.card > .card-f{
  margin:0;padding:9px 15px 11px;border-top:1px solid var(--rule-soft);
  font-family:'DM Mono',monospace;font-size:9px;line-height:1.5;letter-spacing:.05em;color:var(--muted);
}
.card > :not(.card-h):not(.card-f){padding:13px 15px}
.card > .body-flush,.card > .lib,.card > table.tbl,.card > .chartbox,.card > .cal-grid,
.card > .cal-dows,.card > .readout,.card > .seg{padding:0}
.card.flush > :not(.card-h):not(.card-f){padding:0}

/* ── hero: the one thing the screen is for ───────────────────────────────── */
.hero{padding:4px 2px 16px}
.hero-k{
  margin:0;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--muted);
}
.hero-t{
  margin:8px 0 0;font-family:'Libre Baskerville',serif;font-weight:400;
  font-size:26px;line-height:1.12;letter-spacing:-.03em;color:var(--ink);
}
.hero-t .sp{width:7px;height:7px;vertical-align:.22em;margin-right:8px}
.hero-m{margin:7px 0 0;font-size:14px;color:var(--ink-2)}
.hero-done{
  margin:8px 0 0;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--green);
}
.hero-r{border:0;border-top:1px solid var(--rule-soft);margin:14px 0 12px}

/* ── minis: a number that does not deserve a card ───────────────────────── */
.minis{
  display:grid;grid-auto-flow:column;grid-auto-columns:1fr;
  border:1px solid var(--rule);border-radius:4px;background:var(--paper);
  overflow:hidden;margin:0 0 14px;
}
.mini{padding:10px 8px 9px;text-align:center;border-right:1px solid var(--rule-soft)}
.mini:last-child{border-right:0}
.mini b{
  display:block;font-family:'Libre Baskerville',serif;font-weight:400;font-size:17px;
  letter-spacing:-.02em;color:var(--ink);
}
.mini span{
  display:block;margin-top:4px;font-family:'DM Mono',monospace;font-size:8.5px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
}
.mini.warn b{color:var(--amber)}

.flag{
  margin:-6px 0 14px;padding:8px 11px;border-left:2px solid var(--amber);
  background:rgba(183,121,31,.06);font-size:13px;color:var(--ink-2);
}
.flag.ok{border-left-color:var(--green);background:rgba(29,104,64,.05)}
.hint{
  margin:-4px 0 14px;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--muted);
}

/* ── seg: sub-navigation inside a tab ───────────────────────────────────── */
/* Trends holds five charts. Stacked they are a long busy scroll, so only one is
   mounted at a time and this chooses which. */
.seg{
  display:flex;gap:0;margin:0 0 14px;border:1px solid var(--rule);border-radius:4px;
  background:var(--paper);overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.seg::-webkit-scrollbar{display:none}
.seg.wrap{flex-wrap:wrap}
.seg button{
  flex:1 0 auto;appearance:none;background:none;border:0;
  border-right:1px solid var(--rule-soft);padding:9px 12px;cursor:pointer;
  font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);white-space:nowrap;transition:background .16s,color .16s;
}
.seg button:last-child{border-right:0}
.seg button[aria-selected=true]{background:var(--ink);color:var(--paper)}

/* ── calendar grid ──────────────────────────────────────────────────────── */
.cal-nav{margin-left:auto;display:flex;gap:4px}
.cal-mo{
  appearance:none;background:none;border:1px solid var(--rule);border-radius:2px;
  width:26px;height:22px;line-height:1;cursor:pointer;color:var(--ink-2);font-size:14px;
  transition:color .16s,border-color .16s;
}
.cal-mo:hover,.cal-mo:focus-visible{color:var(--green);border-color:var(--green)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-cell{
  appearance:none;background:none;border:0;border-top:1px solid var(--rule-soft);
  border-right:1px solid var(--rule-soft);
  aspect-ratio:1;min-height:40px;padding:5px 0 0;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  -webkit-tap-highlight-color:transparent;transition:background .15s;
}
.cal-cell:nth-child(7n){border-right:0}
.cal-cell.pad{cursor:default;background:rgba(154,144,128,.045)}
.cal-cell .n{font-family:'Libre Baskerville',serif;font-size:13px;color:var(--ink-2);line-height:1}
.cal-cell.rest .n{color:var(--muted)}
.cal-cell.today .n{color:var(--green);font-weight:700}
.cal-cell.today{background:rgba(29,104,64,.055)}
.cal-cell.sel{background:var(--ink)}
.cal-cell.sel .n{color:var(--paper)}
.cal-cell:hover:not(.pad):not(.sel){background:rgba(24,22,15,.035)}
.cal-cell .dots{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;max-width:80%}
.dot{
  width:4px;height:4px;border-radius:50%;display:block;
  border:1px solid currentColor;background:transparent;
}
.dot.done{background:currentColor}
.dot.sp-swim{color:var(--blue)} .dot.sp-bike{color:var(--green)}
.dot.sp-run{color:var(--amber)} .dot.sp-strength{color:var(--ink-2)}
.dot.sp-other{color:var(--muted)}
.cal-cell.sel .dot{border-color:var(--paper);color:var(--paper)}

/* ── misc ───────────────────────────────────────────────────────────────── */
.goals{
  border:1px solid var(--rule);border-radius:4px;background:var(--paper);
  padding:4px 15px;margin:0 0 14px;
}
.statline{display:flex;align-items:baseline;gap:9px}
.statline b{font-family:'Libre Baskerville',serif;font-weight:400;font-size:22px;letter-spacing:-.02em}
.statline span{
  font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);
}
.kv{
  font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--muted);
}
.sp-strength{background:var(--ink-2)}


/* ── settings: tool links ───────────────────────────────────────────────── */
.toolrow{
  display:flex;align-items:center;gap:12px;padding:11px 15px;text-decoration:none;
  border-bottom:1px solid var(--rule-soft);color:inherit;
}
.toolrow:last-child{border-bottom:0}
.toolrow:hover{background:rgba(24,22,15,.03)}
.toolrow .gate-row-t b{font-size:15px}

/* ── settings: athlete picker rows ──────────────────────────────────────── */
.pickrow{
  width:100%;display:flex;align-items:center;gap:13px;
  appearance:none;background:none;border:0;border-bottom:1px solid var(--rule-soft);
  padding:12px 15px;cursor:pointer;text-align:left;
}
.pickrow:last-child{border-bottom:0}
.pickrow .gate-mark{width:32px;height:32px;font-size:14px}
.pickrow.on .gate-mark{background:var(--green);border-color:var(--green);color:var(--paper)}
.pickrow.on .gate-go{color:var(--green)}
.pickrow:hover:not(.on){background:rgba(24,22,15,.03)}

/* ── weekly totals ──────────────────────────────────────────────────────── */
.wk{padding:11px 15px;border-bottom:1px solid var(--rule-soft)}
.wk:last-child{border-bottom:0}
.wk-h{display:flex;align-items:baseline;gap:9px}
.wk-d{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.wk-tag{
  font-family:'DM Mono',monospace;font-size:7.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);border:1px solid var(--rule);border-radius:2px;padding:1px 4px;
}
.wk-n{margin-left:auto;font-family:'Libre Baskerville',serif;font-size:16px;letter-spacing:-.02em}
.wk-t{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted)}
.wk-s{display:flex;flex-wrap:wrap;gap:4px 11px;margin-top:6px}
.wk-s span{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.05em;color:var(--ink-2)}
.wk-s .sp{width:4px;height:4px;margin-right:4px}


/* ── calendar: one row per week ─────────────────────────────────────────── */
/* wk N | the seven days | the week's totals, on ONE line. A 7x5 month grid put the
   week's numbers nowhere near its days; this reads the way a coach reads a week. */
/* Header and week rows share ONE column model: a 34px week label, a 7-column day grid,
   and a fixed-width summary. The summary must be a fixed width - when it sized to its
   content, the header's empty summary box collapsed to 0 and the seven day columns in
   the header were wider than the seven below them. */
.cal-dows{
  display:flex;align-items:center;gap:8px;padding:9px 12px 5px;
  border-bottom:1px solid var(--rule-soft);
}
.cal-dows .wkdays span{
  text-align:center;font-family:'DM Mono',monospace;font-size:8.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);
}
.wkrows{}
.wkrow{padding:8px 12px 9px;border-bottom:1px solid var(--rule-soft)}
.wkrow:last-child{border-bottom:0}
.wkrow-t{display:flex;align-items:center;gap:8px}
.wkn{
  flex:0 0 34px;font-family:'DM Mono',monospace;font-size:8.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);
}
.wkdays{flex:1 1 auto;display:grid;grid-template-columns:repeat(7,1fr);gap:2px;min-width:0}
.wkd{
  appearance:none;background:none;border:0;border-radius:3px;padding:4px 0 3px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  -webkit-tap-highlight-color:transparent;transition:background .15s;
}
.wkd .n{font-family:'Libre Baskerville',serif;font-size:11.5px;color:var(--ink-2);line-height:1}
.wkd .dots{display:flex;gap:1.5px;min-height:5px;align-items:center}
.wkd.out{opacity:.32}
.wkd.rest .n{color:var(--muted)}
.wkd.nodata .n{color:var(--rule)}
.wkd.today{background:rgba(29,104,64,.08)}
.wkd.today .n{color:var(--green);font-weight:700}
.wkd.sel{background:var(--ink)}
.wkd.sel .n{color:var(--paper)}
.wkd.sel .dot{border-color:var(--paper);color:var(--paper)}
.wkd:hover:not(.sel){background:rgba(24,22,15,.04)}
.wksum{flex:0 0 62px;text-align:right;font-family:'DM Mono',monospace;font-size:8.5px;color:var(--muted);line-height:1.3}
.wksum b{display:block;font-family:'Libre Baskerville',serif;font-size:13px;color:var(--ink);letter-spacing:-.01em}
.wkrow-s{display:flex;flex-wrap:wrap;gap:3px 9px;margin:5px 0 0 42px}
.wkrow-s span{font-family:'DM Mono',monospace;font-size:8.5px;color:var(--ink-2)}
.wkrow-s .sp{width:4px;height:4px;margin-right:3px}

/* A long table stays inside the card and scrolls itself, so the page never grows a
   horizontal scrollbar and the card keeps its shape. */
.scroller{max-height:340px;overflow-y:auto;-webkit-overflow-scrolling:touch}

.wsum{margin:0;font-size:13.5px;color:var(--ink-2)}
/* Provenance line under each number: quieter than the value it explains. */
table.tbl tr.prov td{
  padding:0 15px 9px;border-bottom:1px solid var(--rule-soft);
  font-family:'DM Mono',monospace;font-size:9px;line-height:1.5;letter-spacing:.04em;
  color:var(--muted);
}

/* ── route outline ─────────────────────────────────────────────────────── */
/* Drawn from a unit-box shape, so the viewBox is 0..1 and the stroke is scaled with
   vector-effect rather than by fighting the transform. */
.route{
  position:relative;background:var(--paper);border:1px solid var(--rule);border-radius:4px;
  padding:12px;margin:0 0 14px;display:flex;align-items:center;justify-content:center;
}
.route svg{flex:0 0 auto;width:min(230px,100%);height:150px;display:block;overflow:visible}
.route polyline{
  fill:none;stroke:var(--green);stroke-width:2;vector-effect:non-scaling-stroke;
  stroke-linejoin:round;stroke-linecap:round;
}
.route circle{fill:var(--amber)}
.route-c{
  position:absolute;right:11px;bottom:9px;
  font-family:'DM Mono',monospace;font-size:8.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--muted);
}

/* ── charts ─────────────────────────────────────────────────────────────── */

.chartbox{position:relative;height:200px;padding:4px 6px 2px}
/* Taller than it looks like it needs to be: three overlaid seasons plus a
   target band on a 225px canvas was unreadable on a phone. */
.chartbox.tall{height:300px}
@media (min-width:520px){.chartbox.tall{height:340px}}


/* ── activity drawer ────────────────────────────────────────────────────── */
/* A sheet from the bottom rather than a centred modal: it is reached by tapping a
   row near the bottom of a phone screen, and it should come from where the thumb is. */
.scrim{
  position:fixed;inset:0;z-index:95;background:rgba(24,22,15,.34);
  opacity:0;visibility:hidden;transition:opacity .26s,visibility .26s;
}
body.drawn .scrim{opacity:1;visibility:visible}
body.drawn{overflow:hidden}
.drawer{
  position:fixed;left:0;right:0;bottom:0;z-index:96;
  max-height:86vh;display:flex;flex-direction:column;
  background:var(--paper-2);border-top:1px solid var(--rule);
  border-radius:14px 14px 0 0;box-shadow:0 -14px 40px rgba(24,22,15,.16);
  transform:translateY(100%);transition:transform .3s cubic-bezier(.16,1,.3,1);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.drawer.on{transform:none}
.drawer::before{
  content:'';position:absolute;top:7px;left:50%;transform:translateX(-50%);
  width:34px;height:3px;border-radius:2px;background:var(--rule);
}
.dr-h{display:flex;align-items:flex-start;gap:12px;padding:20px 18px 13px;border-bottom:1px solid var(--rule)}
.dr-k{
  margin:0;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted);
}
.dr-t{
  margin:6px 0 0;font-family:'Libre Baskerville',serif;font-weight:400;font-size:20px;
  line-height:1.18;letter-spacing:-.025em;color:var(--ink);
}
.dr-t .sp{width:6px;height:6px;vertical-align:.2em;margin-right:7px}
.dr-x{
  margin-left:auto;flex:0 0 auto;appearance:none;background:none;border:1px solid var(--rule);
  border-radius:50%;width:30px;height:30px;cursor:pointer;color:var(--ink-2);font-size:13px;
  transition:color .16s,border-color .16s;
}
.dr-x:hover,.dr-x:focus-visible{color:var(--green);border-color:var(--green)}
.dr-b{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:15px 18px 22px}
.dr-b .card:last-child{margin-bottom:0}

/* a tappable session row should say so */
.sesh.tap{cursor:pointer;-webkit-tap-highlight-color:transparent}
.sesh.tap:hover{background:rgba(24,22,15,.028)}
.sesh.tap:focus-visible{outline:2px solid var(--green);outline-offset:-2px}


/* ── chart readout ──────────────────────────────────────────────────────── */
/* Replaces the floating tooltip on touch. A tooltip on a phone is the wrong
   instrument: your finger covers the point it describes, it needs a precise tap on a
   1px line, and it disappears the moment you lift off. This is a fixed line above the
   chart that updates as you drag, so the value stays put and stays readable. */
.readout{
  display:flex;align-items:baseline;gap:10px;min-height:34px;
  padding:10px 15px 8px;border-bottom:1px solid var(--rule-soft);
}
.readout b{
  font-family:'Libre Baskerville',serif;font-weight:400;font-size:15px;
  letter-spacing:-.015em;color:var(--ink);white-space:nowrap;
}
.readout span{
  font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:.06em;color:var(--muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.seg.sub{margin-top:-6px}
.seg.sub button{padding:7px 11px;font-size:8.5px}

/* ── tab bar ────────────────────────────────────────────────────────────── */

.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:80;
  display:grid;grid-auto-flow:column;grid-auto-columns:1fr;
  background:rgba(239,233,220,.93);
  backdrop-filter:saturate(1.7) blur(14px);-webkit-backdrop-filter:saturate(1.7) blur(14px);
  border-top:1px solid var(--rule);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.tabs button,.tabs a{
  appearance:none;background:none;border:0;cursor:pointer;position:relative;text-decoration:none;
  min-height:var(--tab-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--muted);font-family:'DM Mono',monospace;font-size:7.5px;letter-spacing:.07em;text-transform:uppercase;
  -webkit-tap-highlight-color:transparent;transition:color .16s ease,transform .12s ease;
}
.tabs button:active,.tabs a:active{transform:scale(.93)}
.tabs button[aria-selected=true]{color:var(--ink)}
.tabs button[aria-selected=true]::before{content:'';position:absolute;top:0;width:22px;height:2px;background:var(--green)}
/* Chat leaves the app, so it is marked rather than selectable. */
.tabs a.out{color:var(--green)}
/* The primary action sits proud of the bar in a filled disc. It is the centre item, so
   it needs no label - the shape carries it - and the bar keeps five even columns. */
.tabs a.primary{color:var(--paper);position:relative;overflow:visible}
.tabs a.primary span{display:none}
.tabs a.primary svg{
  width:22px;height:22px;stroke:var(--paper);position:relative;z-index:1;
  transform:translateX(-1px);
}
.tabs a.primary::after{
  content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-52%);
  width:46px;height:46px;border-radius:50%;background:var(--green);
  box-shadow:0 3px 12px rgba(29,104,64,.34);
}
.tabs a.primary:active::after{transform:translate(-50%,-52%) scale(.93)}
.tabs svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:359px){.tabs button span,.tabs a span{display:none}.tabs svg{width:21px;height:21px}}

/* ── chat call ──────────────────────────────────────────────────────────── */

.chat{
  display:flex;align-items:center;gap:11px;width:100%;text-decoration:none;color:var(--paper);
  background:var(--ink);border-radius:3px;padding:13px 15px;margin:0 0 15px;
}
.chat svg{width:19px;height:19px;fill:none;stroke:var(--paper);stroke-width:1.6;flex:0 0 auto}
/* The label wrapper must be a flex column: as a plain inline span the title and
   subtitle ran into each other. */
.chat .txt{display:flex;flex-direction:column;min-width:0}
.chat .t{font-size:14px;line-height:1.25}
.chat .s{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:rgba(248,245,239,.62);margin-top:1px}
.chat .go{margin-left:auto;font-family:'DM Mono',monospace;font-size:14px;color:rgba(248,245,239,.55)}

/* ── states ─────────────────────────────────────────────────────────────── */

.empty{padding:26px 15px;text-align:center;color:var(--muted);font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.skel{height:11px;background:linear-gradient(90deg,var(--rule-soft),var(--rule),var(--rule-soft));background-size:200% 100%;border-radius:2px;animation:sweep 1.3s linear infinite}
@keyframes sweep{from{background-position:200% 0}to{background-position:-200% 0}}
.offline{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 13px);z-index:90;
  background:var(--ink);color:var(--paper);border-radius:999px;padding:7px 14px;
  font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  opacity:0;pointer-events:none;transition:opacity .22s ease;
}
.offline.on{opacity:1}

@media (display-mode:standalone){
  body{-webkit-user-select:none;user-select:none}
  table,.lib .inner,.selectable{-webkit-user-select:text;user-select:text}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<header class="masthead">
  <div class="masthead-row">
    <h1 class="wordmark"><img src="icons/dpc-mark.png" alt="" class="mark">Peak</h1>
    <div class="countdown" id="cd"><b>—</b>days to race</div>
    <button type="button" class="gear" id="gear" aria-pressed="false" aria-label="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 3.2h3.4l.5 2.2 1.9.8 1.9-1.2 2.4 2.4-1.2 1.9.8 1.9 2.2.5v3.4l-2.2.5-.8 1.9 1.2 1.9-2.4 2.4-1.9-1.2-1.9.8-.5 2.2h-3.4l-.5-2.2-1.9-.8-1.9 1.2-2.4-2.4 1.2-1.9-.8-1.9-2.2-.5v-3.4l2.2-.5.8-1.9-1.2-1.9 2.4-2.41.9 1.2 1.9-.8z"/><circle cx="12" cy="12" r="3.1"/></svg>
    </button>
  </div>
  <div class="whobar">
    <button type="button" class="whobar-name" id="whoName">—</button>
  </div>
</header>

<!-- Entry screen. Deliberately NOT authentication: this data is published to a public
     URL, so a client-side gate would secure nothing and pretending otherwise would be
     worse than being plain about it. It exists to make the app open on a profile choice
     the way an app does, and to remember it. -->
<div class="gate out" id="gate" role="dialog" aria-modal="true" aria-label="Choose athlete">
  <div class="gate-inner">
    <img src="icons/dpc-mark.png" alt="Diamond Peak Consulting" class="gate-logo">
    <p class="gate-kicker">Diamond Peak · Coaching</p>
    <h2 class="gate-word">Peak</h2>
    <p class="gate-sub">Choose a profile to open the training almanac.</p>
    <div class="gate-list" id="gateList"></div>
    <p class="gate-foot">No password. This device remembers your choice.</p>
  </div>
</div>

<main>
  <section class="view on" id="v-today" role="tabpanel" aria-label="Today"></section>
  <section class="view" id="v-cal" role="tabpanel" aria-label="Calendar"></section>
  <section class="view" id="v-trends" role="tabpanel" aria-label="Trends"></section>
  <section class="view" id="v-goals" role="tabpanel" aria-label="Goals"></section>
  <section class="view" id="v-set" role="tabpanel" aria-label="Settings"></section>
</main>

<nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav>
<div class="offline" id="off" role="status">Offline · last loaded data</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Activity detail"></aside>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.2.0/dist/chartjs-plugin-zoom.min.js" defer></script>
<!-- ?v= is load-bearing: an older service worker still controlling this page
     serves app/app.js cache-first, and a stale script against this markup is a
     broken launch. A new URL cannot hit that cache entry. Bump on JS change. -->
<script src="app.js?v=14" defer></script>
</body>
</html>
