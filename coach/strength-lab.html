<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Strength library (preview) — Peak</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Strength library preview (17 Oct 2026). Proof of concept for Jamie: the 40-exercise
   library, each exercise drawn in code from its two most useful angles, and the
   suggested sessions built from it. Not linked from Peak yet. */
:root{--ink:#0b0d10;--ink2:rgba(30,34,40,.78);--muted:rgba(60,60,67,.6);--rule:rgba(60,60,67,.12);
  --accent:#10656b;--card:#fff;--fig:#f3f5f7}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);background:#eceff2;
  -webkit-font-smoothing:antialiased;min-height:100vh}
.page{max-width:980px;margin:0 auto;padding:22px 16px 60px}
.kicker{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
h1{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:4px 0 6px}
.intro{color:var(--ink2);font-size:15px;line-height:1.45;max-width:620px}
.seg{display:inline-flex;background:rgba(118,118,128,.12);border-radius:10px;padding:2px;margin:18px 0 14px}
.seg button{border:0;background:none;font:inherit;font-size:14px;font-weight:600;color:var(--ink);
  padding:7px 18px;border-radius:8px;cursor:pointer}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{border:1px solid var(--rule);background:rgba(255,255,255,.7);font:inherit;font-size:13px;font-weight:500;
  color:var(--ink2);padding:5px 12px;border-radius:999px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
h2{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:var(--card);border-radius:16px;overflow:hidden;cursor:pointer;border:0;text-align:left;font:inherit;
  color:inherit;box-shadow:0 1px 2px rgba(15,25,40,.05),0 6px 18px rgba(15,25,40,.05);transition:transform .15s}
.card:active{transform:scale(.98)}
.card .fig{aspect-ratio:1;background:var(--fig)}
.card .t{padding:9px 11px 11px}
.card .n{font-size:14px;font-weight:600;line-height:1.25}
.card .m{font-size:12px;color:var(--muted);margin-top:2px}
.empty{color:var(--muted);font-size:14px;padding:20px 0}
/* sheet */
.sheet{position:fixed;inset:0;background:rgba(10,14,20,.35);display:none;z-index:10;overflow:auto;
  -webkit-overflow-scrolling:touch}
.sheet.open{display:block}
.panel{background:#f7f8fa;max-width:760px;margin:0 auto;min-height:100%;padding:14px 16px 50px}
@media(min-width:800px){.panel{margin:30px auto;min-height:0;border-radius:22px}}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.close{border:0;background:rgba(118,118,128,.14);width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer;color:var(--ink)}
.views{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.view{background:var(--fig);border-radius:16px;aspect-ratio:1;position:relative}
.view span{position:absolute;left:10px;top:8px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.view div{position:absolute;inset:0}
.ex h3{font-size:24px;font-weight:700;letter-spacing:-.01em;margin:14px 0 4px}
.why{color:var(--ink2);font-size:15px;line-height:1.45}
.dose{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.dose b{background:#fff;border-radius:10px;padding:7px 11px;font-size:13px;font-weight:600}
.dose b small{display:block;font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.box{background:#fff;border-radius:16px;padding:12px 14px;margin-top:10px}
.box h4{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.box ol,.box ul{padding-left:18px;font-size:14px;line-height:1.5}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:rgba(16,101,107,.1);color:var(--accent)}
.tag.dim{background:rgba(118,118,128,.12);color:var(--ink2)}
.ladder{display:flex;gap:8px;margin-top:10px}
.ladder button{flex:1;border:0;background:#fff;border-radius:14px;padding:10px 12px;text-align:left;font:inherit;cursor:pointer;color:inherit}
.ladder small{display:block;font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.ladder button:disabled{opacity:.45;cursor:default}
.caut{font-size:14px;line-height:1.45;margin:3px 0}
.caut b{text-transform:capitalize}
/* sessions */
.scard{background:#fff;border-radius:16px;padding:14px 16px;cursor:pointer;border:0;font:inherit;color:inherit;text-align:left;
  width:100%;margin-bottom:10px;box-shadow:0 1px 2px rgba(15,25,40,.05)}
.scard .n{font-size:16px;font-weight:700}
.scard .m{font-size:13px;color:var(--ink2);margin-top:3px;line-height:1.4}
.part{margin-top:16px}
.part h4{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.row{display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;padding:6px 12px 6px 6px;margin-bottom:6px;
  cursor:pointer;border:0;width:100%;font:inherit;color:inherit;text-align:left}
.row .th{width:58px;height:58px;border-radius:10px;background:var(--fig);flex:none;overflow:hidden}
.row .n{font-size:15px;font-weight:600}
.row .m{font-size:13px;color:var(--ink2)}
.foot{margin-top:30px;font-size:12px;color:var(--muted)}
.row.free{cursor:default}
.row.free .th{display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--muted);text-align:center;line-height:1.2;padding:4px}
.note{font-size:14px;line-height:1.45;color:var(--ink2);margin:4px 0}
.note b{color:var(--ink)}
</style>
</head>
<body>
<div class="page">
  <div class="kicker">Preview · not in Peak yet</div>
  <h1>Strength library</h1>
  <p class="intro" id="intro">Loading…</p>
  <div class="seg" role="tablist">
    <button class="on" data-tab="ex">Exercises</button><button data-tab="ss">Suggested sessions</button>
  </div>
  <div id="tab-ex">
    <div class="chips" id="f-sport"></div>
    <div class="chips" id="f-tier"></div>
    <div id="lib"></div>
  </div>
  <div id="tab-ss" hidden><div id="sessions"></div></div>
  <p class="foot">Drawn in code from each exercise's key positions. Coaching content is a draft for review.</p>
</div>
<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>

<script src="figure.js"></script>
<script src="exercise-anims.js"></script>
<script>
(function () {
  'use strict';
  var LIB = null, ANIMS = window.PeakAnims || {};
  var SPORTS = [['all', 'All'], ['run', 'Run'], ['bike', 'Bike'], ['swim', 'Swim'], ['health', 'All-round health']];
  var TIERS = [['all', 'Any kit'], ['A', 'Gym'], ['B', 'Dumbbells'], ['C', 'Bodyweight / band']];
  var TIER_NAME = { A: 'Gym', B: 'Dumbbells', C: 'No weights needed' };
  var state = { sport: 'all', tier: 'all' };
  var live = [];   // running thumbnail animations
  var sheetAnim = [];

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function pretty(id) { return String(id).replace(/_/g, ' ').replace(/^./, function (c) { return c.toUpperCase(); }); }
  function exName(id) { return LIB.exercises[id] ? LIB.exercises[id].name : pretty(id); }
  function tierOK(e) {
    if (state.tier === 'all') return true;
    // a gym can do everything; dumbbells can do dumbbell and bodyweight work
    return state.tier === 'A' || (state.tier === 'B' ? e.tier !== 'A' : e.tier === 'C');
  }

  // Thumbnails animate only while on screen, at 30 fps, so 40 figures don't cook a phone.
  var io = 'IntersectionObserver' in window ? new IntersectionObserver(function (ents) {
    ents.forEach(function (en) {
      var el = en.target, id = el.getAttribute('data-anim');
      if (en.isIntersecting && !el._ctl && ANIMS[id]) {
        el._ctl = PeakFigure.play([el], ANIMS[id], { views: [(ANIMS[id].views || ['side'])[0]], fps: 30 });
      } else if (!en.isIntersecting && el._ctl) { el._ctl.stop(); el._ctl = null; }
    });
  }, { rootMargin: '80px' }) : null;
  function watch(root) {
    root.querySelectorAll('[data-anim]').forEach(function (el) {
      live.push(el);
      if (io) io.observe(el);
      else if (ANIMS[el.getAttribute('data-anim')]) el._ctl = PeakFigure.play([el], ANIMS[el.getAttribute('data-anim')], { fps: 30, still: true });
    });
  }
  function unwatch() {
    live.forEach(function (el) { if (io) io.unobserve(el); if (el._ctl) el._ctl.stop(); el._ctl = null; });
    live = [];
  }

  function chips(elId, list, key) {
    document.getElementById(elId).innerHTML = list.map(function (c) {
      return '<button class="chip' + (state[key] === c[0] ? ' on' : '') + '" data-k="' + key + '" data-v="' + c[0] + '">' + c[1] + '</button>';
    }).join('');
  }

  function renderLib() {
    unwatch();
    chips('f-sport', SPORTS, 'sport'); chips('f-tier', TIERS, 'tier');
    var groups = {}, order = [];
    Object.keys(LIB.exercises).forEach(function (id) {
      var e = LIB.exercises[id];
      if (state.sport !== 'all' && !((e.sports || {})[state.sport] >= 2)) return;
      if (!tierOK(e)) return;
      if (!groups[e.pattern]) { groups[e.pattern] = []; order.push(e.pattern); }
      groups[e.pattern].push(id);
    });
    var html = order.map(function (p) {
      return '<h2>' + esc(pretty(p)) + '</h2><div class="grid">' + groups[p].map(card).join('') + '</div>';
    }).join('');
    var lib = document.getElementById('lib');
    lib.innerHTML = html || '<p class="empty">Nothing matches those filters.</p>';
    watch(lib);
  }
  function card(id) {
    var e = LIB.exercises[id];
    return '<button class="card" data-ex="' + id + '"><div class="fig" data-anim="' + id + '"></div><div class="t"><div class="n">' +
      esc(e.name) + '</div><div class="m">' + esc(TIER_NAME[e.tier] || '') + (e.per_side ? ' · each side' : '') + '</div></div></button>';
  }

  function renderSessions() {
    var list = LIB.example_sessions || [], issues = (LIB.issues || {}).examples || [];
    document.getElementById('sessions').innerHTML = (list.map(function (s) {
      return '<button class="scard" data-ss="' + esc(s.id) + '"><div class="n">' + esc(s.title) + '</div><div class="m">' +
        esc(s.minutes ? s.minutes + ' min · ' : '') + esc(s['for'] || '') + '</div></button>';
    }).join('') || '<p class="empty">No suggested sessions yet.</p>') +
      (issues.length ? '<h2>An athlete\'s own issue</h2><p class="note" style="margin-bottom:10px">Each athlete can carry their own injuries or rehab. ' +
        'A physio\'s sessions go in as they are, and Peak builds the rest of the week round them. Examples:</p>' +
        issues.map(function (x) {
          return '<button class="scard" data-is="' + esc(x.id) + '"><div class="n">' + esc(x.title) + '</div><div class="m">' + esc(x.summary) + '</div></button>';
        }).join('') : '');
  }

  // A library exercise is a tappable row with its animation; a physio's exercise that
  // isn't in the library yet is shown plainly, never as an empty tap target.
  function itemRow(it, rx) {
    if (it.ex && LIB.exercises[it.ex]) {
      return '<button class="row" data-ex="' + esc(it.ex) + '"><div class="th" data-anim="' + esc(it.ex) + '"></div><div><div class="n">' +
        esc(exName(it.ex)) + '</div><div class="m">' + esc(rx) + '</div></div></button>';
    }
    return '<div class="row free"><div class="th">Not in the library yet</div><div><div class="n">' + esc(it.name || it.ex) +
      '</div><div class="m">' + esc(rx) + '</div></div></div>';
  }
  function itemRx(it) {
    if (it.sets === 'set by physio' || it.reps === 'set by physio') return 'Sets, reps and load set by the physio';
    return [it.sets ? it.sets + ' × ' : '', it.reps || '', it.load && it.load !== 'none' ? ' · ' + it.load : '',
      it.rest_s ? ' · rest ' + it.rest_s + ' s' : ''].join('');
  }
  function showIssue(iid) {
    var x = ((LIB.issues || {}).examples || []).filter(function (e) { return e.id === iid; })[0];
    if (!x) return;
    var is = x.issue || {}, pr = is.protocol || {}, bo = x.builder_output || {};
    var html = '<div class="bar"><button class="close" data-close aria-label="Close">×</button></div>' +
      '<div class="ex"><h3 style="margin-top:0">' + esc(x.title) + '</h3><p class="why">' + esc(x.summary) + '</p>' +
      '<div class="tags" style="margin-top:10px"><span class="tag">' + esc(pretty(is.area || is.location || '')) + '</span>' +
      '<span class="tag dim">' + esc(pretty(is.status || '')) + '</span><span class="tag dim">Set by ' + esc(is.source || '') + '</span></div>' +
      (pr.sessions || []).map(function (ss) {
        return '<div class="part"><h4>' + esc(ss.title) + ' · ' + esc(ss.per_week) + '× a week' + (ss.minutes ? ' · ' + ss.minutes + ' min' : '') +
          (ss.counts_as_strength === false ? ' · outside the strength cap' : '') + '</h4>' +
          (ss.items || []).map(function (it) { return itemRow(it, itemRx(it)); }).join('') + '</div>';
      }).join('') +
      (bo.top_up ? '<div class="part"><h4>What Peak adds · ' + esc(bo.top_up.title) + (bo.top_up.minutes ? ' · ' + bo.top_up.minutes + ' min' : '') + '</h4>' +
        (bo.top_up.placement ? '<p class="note">' + esc(bo.top_up.placement) + '</p>' : '') +
        (bo.top_up.items || []).map(function (it) { return itemRow(it, itemRx(it)); }).join('') + '</div>' : '') +
      '<div class="box"><h4>How Peak plans round it</h4>' +
      [['Strength cap', bo.cap], ['Already covered', bo.covered_note], ['Held back', bo.blocked_note || bo.plyometrics],
       ['Cautions', bo.cautions_note], ['Clashes', bo.conflict_to_flag], ['After each session Peak asks', bo.debrief]]
        .filter(function (r) { return r[1]; })
        .map(function (r) { return '<p class="note"><b>' + r[0] + ':</b> ' + esc(r[1]) + '</p>'; }).join('') + '</div></div>';
    openSheet(html);
    document.querySelectorAll('#panel [data-anim]').forEach(function (el) {
      var an = ANIMS[el.getAttribute('data-anim')];
      if (an) el._ctl = PeakFigure.play([el], an, { views: [(an.views || ['side'])[0]], fps: 30 });
    });
  }

  // ── sheet ──
  function openSheet(html) {
    stopSheet();
    var p = document.getElementById('panel');
    p.innerHTML = html;
    document.getElementById('sheet').classList.add('open');
    document.body.style.overflow = 'hidden';
    document.getElementById('sheet').scrollTop = 0;
  }
  function stopSheet() {
    sheetAnim.forEach(function (c) { c.stop(); }); sheetAnim = [];
    document.querySelectorAll('#panel [data-anim]').forEach(function (el) { if (el._ctl) el._ctl.stop(); });
  }
  function closeSheet() {
    stopSheet();
    document.getElementById('sheet').classList.remove('open');
    document.body.style.overflow = '';
  }

  function doseBits(d, perSide) {
    if (!d) return '';
    var b = [];
    if (d.sets) b.push(['Sets', d.sets]);
    if (d.reps) b.push(['Reps', d.reps + (perSide ? ' each side' : '')]);
    if (d.rpe) b.push(['Effort', 'RPE ' + d.rpe]);
    if (d.rest_s) b.push(['Rest', d.rest_s >= 60 ? Math.round(d.rest_s / 60 * 10) / 10 + ' min' : d.rest_s + ' s']);
    if (d.tempo) b.push(['Tempo', d.tempo]);
    return '<div class="dose">' + b.map(function (x) { return '<b><small>' + x[0] + '</small>' + esc(x[1]) + '</b>'; }).join('') + '</div>';
  }

  function showExercise(id) {
    var e = LIB.exercises[id], an = ANIMS[id];
    if (!e) return;
    var views = an ? (an.views || ['side', 'front']) : [];
    var sports = Object.keys(e.sports || {}).filter(function (k) { return e.sports[k] >= 2; });
    var labels = { run: 'Run', bike: 'Bike', swim: 'Swim', health: 'All-round health' };
    var html = '<div class="bar"><button class="close" data-close aria-label="Close">×</button></div>' +
      '<div class="ex"><div class="views">' + views.map(function (v, i) {
        return '<div class="view"><div id="v' + i + '"></div><span id="l' + i + '"></span></div>';
      }).join('') + '</div>' +
      '<h3>' + esc(e.name) + '</h3><p class="why">' + esc(e.why) + '</p>' + doseBits(e.dose, e.per_side) +
      (e.dose && e.dose.note ? '<p class="why" style="font-size:13px">' + esc(e.dose.note) + '</p>' : '') +
      (e.cues && e.cues.length ? '<div class="box"><h4>How to do it</h4><ol>' + e.cues.map(function (c) { return '<li>' + esc(c) + '</li>'; }).join('') + '</ol></div>' : '') +
      (e.mistakes && e.mistakes.length ? '<div class="box"><h4>Watch out for</h4><ul>' + e.mistakes.map(function (c) { return '<li>' + esc(c) + '</li>'; }).join('') + '</ul></div>' : '') +
      '<div class="ladder"><button ' + (e.easier ? 'data-ex="' + e.easier + '"' : 'disabled') + '><small>Easier</small>' + esc(e.easier ? exName(e.easier) : 'None') + '</button>' +
      '<button ' + (e.harder ? 'data-ex="' + e.harder + '"' : 'disabled') + '><small>Harder</small>' + esc(e.harder ? exName(e.harder) : 'None') + '</button></div>' +
      (e.cautions && Object.keys(e.cautions).length ? '<div class="box"><h4>If something hurts</h4>' + Object.keys(e.cautions).map(function (k) {
        return '<p class="caut"><b>' + esc(pretty(k)) + ':</b> ' + esc(e.cautions[k]) + '</p>'; }).join('') + '</div>' : '') +
      '<div class="box"><h4>Helps with</h4><div class="tags">' + sports.map(function (s) { return '<span class="tag">' + labels[s] + '</span>'; }).join('') +
      '</div>' + (e.muscles ? '<h4 style="margin-top:10px">Muscles</h4><div class="tags">' + (e.muscles.target || []).map(function (m) { return '<span class="tag">' + esc(m) + '</span>'; }).join('') +
      (e.muscles.synergists || []).map(function (m) { return '<span class="tag dim">' + esc(m) + '</span>'; }).join('') + '</div>' : '') +
      '<h4 style="margin-top:10px">Kit</h4><div class="tags">' + (e.equipment || []).map(function (q) { return '<span class="tag dim">' + esc(pretty(q)) + '</span>'; }).join('') +
      '<span class="tag dim">' + esc(TIER_NAME[e.tier] || '') + '</span></div></div></div>';
    openSheet(html);
    if (an) {
      var ctl = PeakFigure.play(views.map(function (v, i) { return document.getElementById('v' + i); }), an);
      ctl.labels.forEach(function (l, i) { document.getElementById('l' + i).textContent = l; });
      sheetAnim.push(ctl);
    }
  }

  function showSession(sid) {
    var s = (LIB.example_sessions || []).filter(function (x) { return x.id === sid; })[0];
    if (!s) return;
    var html = '<div class="bar"><button class="close" data-close aria-label="Close">×</button></div>' +
      '<div class="ex"><h3 style="margin-top:0">' + esc(s.title) + '</h3><p class="why">' + esc((s.minutes ? s.minutes + ' min · ' : '') + (s['for'] || '')) + '</p>' +
      (s.parts || []).map(function (p) {
        return '<div class="part"><h4>' + esc(p.title) + '</h4>' + (p.items || []).map(function (it) {
          var e = LIB.exercises[it.ex] || {};
          var rx = [it.sets ? it.sets + ' × ' : '', it.reps || '', e.per_side && it.reps && !/side/.test(it.reps) ? ' each side' : ''].join('');
          var rest = it.rest_s ? ' · rest ' + (it.rest_s >= 60 ? Math.round(it.rest_s / 6) / 10 + ' min' : it.rest_s + ' s') : '';
          return '<button class="row" data-ex="' + esc(it.ex) + '"><div class="th" data-anim="' + esc(it.ex) + '"></div><div><div class="n">' +
            esc(exName(it.ex)) + '</div><div class="m">' + esc(rx + rest) + (it.note ? ' · ' + esc(it.note) : '') + '</div></div></button>';
        }).join('') + '</div>';
      }).join('') + '</div>';
    openSheet(html);
    document.querySelectorAll('#panel [data-anim]').forEach(function (el) {
      var an = ANIMS[el.getAttribute('data-anim')];
      if (an) el._ctl = PeakFigure.play([el], an, { views: [(an.views || ['side'])[0]], fps: 30 });
    });
  }

  // ── routing: #ex/<id>, #ss/<id>, so the back button closes a sheet ──
  function route() {
    var h = location.hash.slice(1).split('/');
    if (h[0] === 'ex' && h[1]) showExercise(h[1]);
    else if (h[0] === 'ss' && h[1]) showSession(h[1]);
    else if (h[0] === 'is' && h[1]) showIssue(h[1]);
    else closeSheet();
  }
  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('[data-k],[data-ex],[data-ss],[data-is],[data-close],[data-tab]');
    if (!t) { if (ev.target.id === 'sheet') history.back(); return; }
    if (t.hasAttribute('data-k')) { state[t.getAttribute('data-k')] = t.getAttribute('data-v'); renderLib(); }
    else if (t.hasAttribute('data-ex')) {
      if (location.hash.indexOf('#ex/') === 0) location.replace('#ex/' + t.getAttribute('data-ex'));
      else location.hash = 'ex/' + t.getAttribute('data-ex');
    }
    else if (t.hasAttribute('data-ss')) location.hash = 'ss/' + t.getAttribute('data-ss');
    else if (t.hasAttribute('data-is')) location.hash = 'is/' + t.getAttribute('data-is');
    else if (t.hasAttribute('data-close')) { if (history.length > 1) history.back(); else location.hash = ''; }
    else if (t.hasAttribute('data-tab')) {
      var tab = t.getAttribute('data-tab');
      document.querySelectorAll('.seg button').forEach(function (b) { b.classList.toggle('on', b === t); });
      document.getElementById('tab-ex').hidden = tab !== 'ex';
      document.getElementById('tab-ss').hidden = tab !== 'ss';
    }
  });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && document.getElementById('sheet').classList.contains('open')) history.back(); });
  window.addEventListener('hashchange', route);

  fetch('../ClaudeCoach/public/exercise-library.json', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (d) {
      LIB = d;
      var n = Object.keys(d.exercises).length, drawn = Object.keys(d.exercises).filter(function (id) { return ANIMS[id]; }).length;
      document.getElementById('intro').textContent = n + ' exercises, each shown from its two most useful angles' +
        (drawn < n ? ' (' + drawn + ' animated so far)' : '') + '. Tap one for how to do it, or open a suggested session.';
      renderLib(); renderSessions(); route();
    })
    .catch(function (e) { document.getElementById('intro').textContent = 'Could not load the library (' + e.message + ').'; });
})();
</script>
</body>
</html>
